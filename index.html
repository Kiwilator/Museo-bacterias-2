<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>PURPLE BACTERIA</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="./style.css?v=9b42dda">
</head>
<body>

  <div id="loading-screen">
    <div id="loading-title">PURPLE BACTERIA</div>
    <div id="loading-spinner"></div>
  </div>

  <div id="controls-help">
    <span><b>WASD</b> Moverse</span>
    <span><b>Arrastrar</b> Mirar</span>
  </div>

  <a-scene
    renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 0.88"
    shadow="type: pcfsoft"
    background="color: #bda98f"
    fog="type: linear; color: #c9b79a; near: 3; far: 12"
  >
    <a-assets timeout="60000">
      <a-asset-item id="museum_floor" src="./modulos/museum_floor.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="museum_walls" src="./modulos/museum_walls.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="museum_neons" src="./modulos/museum_neons.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bacteria_large_01" src="./modulos/bacteria_large_01.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bacteria_large_02" src="./modulos/bacteria_large_02.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bacteria_small_01" src="./modulos/bacteria_small_01.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bacteria_small_02" src="./modulos/bacteria_small_02.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bacteria_small_03" src="./modulos/bacteria_small_03.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bacteria_small_04" src="./modulos/bacteria_small_04.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bacteria_small_05" src="./modulos/bacteria_small_05.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bacteria_small_06" src="./modulos/bacteria_small_06.glb?v=9b42dda"></a-asset-item>
      <a-asset-item id="bioreactor" src="./modulos/bioreactor.glb?v=9b42dda"></a-asset-item>
      <video id="ppb-video-01" src="./assets/videos/rhodospirillum-rubrum-pha.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
    </a-assets>

    <!-- Modelo (museo_bacterias.glb?v=9b42dda"tira de techo" que cruzaba la
         sala como una curva flotante. El resto de neones sí está pegado a
         bordes reales (ventana, nicho, peana, junta) y se exporta intacto.
         Suelo y pared llevan ahora textura horneada (antes eran nodos
         procedurales de Blender -- Noise/Bump/ColorRamp -- que glTF no
         puede leer y se exportaban como color plano). Coloca el rig del
         jugador dentro del espacio orientado a la exposición, y calcula los
         límites/huecos de navegación (ver script.js). -->
    <!-- El museo se carga como doce modulos independientes. Cada GLB conserva
         las coordenadas de mundo de Blender, asi que todos van en el mismo
         origen (0 0 0) y el conjunto se reconstruye solo. La escala se calcula
         UNA vez sobre el contenedor cuando todos han terminado de cargar: si
         cada modulo se midiera por separado, cada uno saldria con un factor
         distinto y las piezas no encajarian. Para sustituir una pieza basta
         con reemplazar su .glb, sin reexportar el resto. -->
    <a-entity
      id="modelo"
      setup-museum-model="length: 10.7; height: 8; wallMargin: 0.4; playerRadius: 0.15; eyeHeight: 1.0"
      web-fixes
      exhibit-info
      exhibit-lighting
      image-windows
      position="0 0 0"
      shadow="cast: true; receive: true"
    >
      <a-entity gltf-model="#museum_floor" gltf-animations></a-entity>
      <a-entity gltf-model="#museum_walls" gltf-animations></a-entity>
      <a-entity gltf-model="#museum_neons" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_large_01" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_large_02" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_01" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_02" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_03" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_04" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_05" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_06" gltf-animations></a-entity>
      <a-entity gltf-model="#bioreactor" gltf-animations></a-entity>

      <!-- Pantallas circulares (sala violeta): 6 circulos independientes,
           colocados en las posiciones/orientaciones reales extraidas de los
           circulos de Blender (PPB_VIDEO_01..06). Posicion, radio y rotacion
           se recalcularon exportando esos 6 objetos a glTF directamente desde
           Blender (misma tuberia que el resto de modulos, conversion de ejes
           de fabrica) en vez de a mano: el primer intento tenia mal el giro
           en su propio eje (Z) de las seis piezas y el signo de la normal de
           PPB_VIDEO_04. Cada rotacion se valido reconstruyendo su matriz y
           comprobando que el eje Z local vuelve a apuntar hacia el interior
           de la sala. Solo el primer circulo lleva video por ahora; los
           otros cinco llevan un material provisional oscuro/violeta hasta
           que se confirme que el primero funciona. -->
      <a-circle id="PPB_VIDEO_01" position="-1.927 1.401 2.995" rotation="85.56 67.24 -12.50" radius="0.19" material="src: #ppb-video-01; shader: flat; side: double"></a-circle>
      <a-circle id="PPB_VIDEO_02" position="-1.827 1.392 2.268" rotation="63.61 63.98 -7.75" radius="0.197" material="color: #1c0f2b; shader: flat; side: double"></a-circle>
      <a-circle id="PPB_VIDEO_03" position="-1.651 1.391 1.516" rotation="63.32 63.40 -4.55" radius="0.195" material="color: #1c0f2b; shader: flat; side: double"></a-circle>
      <a-circle id="PPB_VIDEO_04" position="-1.965 1.390 -2.116" rotation="120.27 59.37 -175.78" radius="0.206" material="color: #1c0f2b; shader: flat; side: double"></a-circle>
      <a-circle id="PPB_VIDEO_05" position="-2.174 1.396 -2.879" rotation="115.56 61.27 -177.25" radius="0.194" material="color: #1c0f2b; shader: flat; side: double"></a-circle>
      <a-circle id="PPB_VIDEO_06" position="-2.288 1.401 -3.616" rotation="96.69 64.72 -167.26" radius="0.194" material="color: #1c0f2b; shader: flat; side: double"></a-circle>
    </a-entity>

    <!-- Iluminación general: hemisferio cálido (crema arriba / tierra cálida
         abajo), bajado a 0.20 para que deje de aplanar la sala -- el volumen
         real ahora lo aporta la directional y los dos focos de exposición.
         La directional sigue moderada (0.85, calida) para no repetir el
         quemado de las cápsulas moradas (Exhibit_Capsule_Purple, roughness
         bajo → brillo especular marcado) que ya se corrigió una vez: el
         color base/emisivo morado está bien en Blender y en el glTF
         exportado, el problema era solo de exposición combinada. -->
    <a-entity light="type: hemisphere; color: #ffe6c4; groundColor: #8f6d47; intensity: 0.20"></a-entity>
    <a-entity light="type: directional; intensity: 0.85; color: #ffd7a3" position="4 7 2" shadow="cast: true"></a-entity>

    <!-- Player rig: el rig va a nivel de suelo, la cámara dentro lleva la
         altura de ojos. museum-movement da WASD + flechas, suave, sin volar
         (ver script.js: aframe-extras/movement-controls y nav-mesh están
         rotos en esta versión de three.js, así que no se usan). clamp-to-
         bounds es nuestro "navmesh" (rectángulo real del suelo con huecos
         en cada peana). respawn-guard es la red de seguridad si algo
         fallara. -->
    <a-entity
      id="rig"
      position="0 0 0"
      rotation="0 0 0"
      museum-movement="speed: 1.0"
      clamp-to-bounds
      respawn-guard
    >
      <a-entity
        id="camera"
        camera="near: 0.05"
        drag-look-controls
        position="0 0.5 0"
      ></a-entity>
    </a-entity>
  </a-scene>


  <!-- Capa curatorial: un unico aviso, un unico panel y una unica ficha de
       ventana, reutilizados por todas las piezas desde museumContent -->
  <div id="intro-msg">
    <p>MOVE THROUGH THE SPACE AND APPROACH THE EXHIBITS TO DISCOVER MORE</p>
    <span><b>WASD</b> — MOVE &nbsp;&nbsp; <b>DRAG</b> — LOOK</span>
  </div>

  <!-- Grafismo de sala: una sola pieza, muy tenue, como señaletica de museo -->
  <svg id="wall-graphic" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="46"/>
    <circle cx="100" cy="100" r="22"/><circle cx="82" cy="78" r="7"/>
    <circle cx="126" cy="118" r="10"/><circle cx="112" cy="70" r="4"/>
    <path d="M28 100h144M100 28v144"/>
  </svg>

  <button id="exhibit-prompt" type="button">EXPLORE +</button>

  <aside id="exhibit-panel" role="dialog" aria-modal="false">
    <button class="panel-close" type="button" aria-label="Close">&times;</button>
    <span class="panel-section">01</span>
    <span class="panel-icon"></span>
    <h2 class="panel-title"></h2>
    <p class="panel-lead"></p>
    <p class="panel-body"></p>
    <span class="panel-tags"></span>
  </aside>


  <script src="./script.js?v=9b42dda"></script>
</body>
</html>
