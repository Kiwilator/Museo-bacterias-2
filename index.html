<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>PURPLE BACTERIA</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="./style.css?v=1c4ff5e">
</head>
<body>

  <div id="loading-screen">
    <div id="loading-title">PURPLE BACTERIA</div>
    <div id="loading-spinner"></div>
  </div>

  <!-- Texto de ayuda segun dispositivo: is-mobile (ver script.js, deteccion
       arriba del todo del fichero) decide via CSS cual de los dos pares de
       <span> se muestra -- nunca los dos a la vez, para no mostrar
       instrucciones de teclado a quien no tiene teclado. -->
  <div id="controls-help">
    <span class="hint-desktop"><b>WASD</b> Moverse</span>
    <span class="hint-desktop"><b>Arrastrar</b> Mirar</span>
    <span class="hint-mobile"><b>Joystick</b> Moverse</span>
    <span class="hint-mobile"><b>Deslizar</b> Mirar</span>
  </div>

  <!-- Joystick tactil de movimiento: solo visible en moviles (is-mobile).
       Logica en script.js (setupMobileJoystick); nunca anidado dentro del
       canvas de a-scene, para que sus toques no compitan con drag-look-
       controls (mirar) ni con el tap-to-select sobre las piezas. -->
  <div id="mobile-controls" aria-hidden="true">
    <div id="joystick-base"><div id="joystick-nub"></div></div>
  </div>

  <a-scene
    renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 0.80; antialias: true; maxCanvasWidth: 1920; maxCanvasHeight: 1080"
    shadow="type: pcfsoft"
    background="color: #261b2c"
    fog="type: linear; color: #8c748e; near: 9; far: 24"
  >
    <a-assets timeout="60000">
      <a-asset-item id="museum_floor" src="./modulos/museum_floor.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="museum_walls" src="./modulos/museum_walls.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="museum_neons" src="./modulos/museum_neons.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bacteria_large_01" src="./modulos/bacteria_large_01.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bacteria_large_02" src="./modulos/bacteria_large_02.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bacteria_small_01" src="./modulos/bacteria_small_01.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bacteria_small_02" src="./modulos/bacteria_small_02.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bacteria_small_03" src="./modulos/bacteria_small_03.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bacteria_small_04" src="./modulos/bacteria_small_04.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bacteria_small_05" src="./modulos/bacteria_small_05.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bacteria_small_06" src="./modulos/bacteria_small_06.glb?v=1c4ff5e"></a-asset-item>
      <a-asset-item id="bioreactor" src="./modulos/bioreactor.glb?v=1c4ff5e"></a-asset-item>
      <video id="ppb-video-02" src="./assets/videos/scientific-animation.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
      <img id="ppb-image-03" src="./assets/images/cereibacter-sphaeroides-microscopy.jpg" crossorigin="anonymous">
      <img id="ppb-image-04" src="./assets/images/rhodobacter-capsulatus-microscopy.jpg" crossorigin="anonymous">
      <img id="ppb-image-06" src="./assets/images/rhodovulum-electroactivity.jpg" crossorigin="anonymous">
      <img id="ppb-image-07" src="./assets/images/rubrivivax-gelatinosus-tem.jpg" crossorigin="anonymous">
      <img id="ppb-image-08" src="./assets/images/b1.png" crossorigin="anonymous">
    </a-assets>

    <!-- Modelo (museo_bacterias.glb?v=1c4ff5e"tira de techo" que cruzaba la
         sala como una curva flotante. El resto de neones sí está pegado a
         bordes reales (ventana, nicho, peana, junta) y se exporta intacto.
         Suelo y pared llevan ahora textura horneada (antes eran nodos
         procedurales de Blender -- Noise/Bump/ColorRamp -- que glTF no
         puede leer y se exportaban como color plano). Coloca el rig del
         jugador dentro del espacio orientado a la exposición, y calcula los
         límites/huecos de navegación (ver script.js). -->
    <!-- El museo se carga como doce modulos independientes. Cada GLB conserva
         las coordenadas de mundo de Blender, asi que todos van en el mismo
         origen (0 0 0) y el conjunto se reconstruye solo. La escala se calcula
         UNA vez sobre el contenedor cuando todos han terminado de cargar: si
         cada modulo se midiera por separado, cada uno saldria con un factor
         distinto y las piezas no encajarian. Para sustituir una pieza basta
         con reemplazar su .glb, sin reexportar el resto. -->
    <a-entity
      id="modelo"
      setup-museum-model="length: 10.7; height: 8; wallMargin: 0.4; playerRadius: 0.15; eyeHeight: 1.0"
      web-fixes
      exhibit-info
      exhibit-lighting
      image-windows
      mood-lighting
      reactor-control
      position="0 0 0"
      shadow="cast: true; receive: true"
    >
      <a-entity gltf-model="#museum_floor" gltf-animations></a-entity>
      <a-entity gltf-model="#museum_walls" gltf-animations></a-entity>
      <a-entity gltf-model="#museum_neons" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_large_01" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_large_02" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_01" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_02" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_03" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_04" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_05" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_06" gltf-animations></a-entity>
      <a-entity gltf-model="#bioreactor" gltf-animations></a-entity>
    </a-entity>

    <!-- Pantallas circulares (sala violeta): 6 circulos independientes. Sus
         valores de posicion/normal/radio (en placeholder abajo) son crudos,
         sin escalar, tal y como se miden en el propio circulo de Blender
         (centro y normal reales de la malla visible, nunca el origen del
         objeto, que esta en 0,0,0). NO van anidados dentro de #modelo: el
         componente place-ppb-circle (script.js) espera a museo-modules-
         loaded, lee ahi la escala real ya aplicada al museo (no uniforme:
         X/Z y altura se calculan por separado) y coloca cada circulo con esa
         transformacion de mundo real -- anidarlos bajo #modelo combinaba mal
         la rotacion con esa escala no uniforme y los dejaba mal orientados.
         El orden tecnico de PPB_VIDEO_* no coincide con la numeracion de
         las fichas; cada display se asigna aqui a la bacteria que tiene
         debajo en Blender. -->
    <a-circle id="PPB_VIDEO_01" place-ppb-circle="id: PPB_VIDEO_01" radius="0.01" material="src: #ppb-image-08; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_02" place-ppb-circle="id: PPB_VIDEO_02" radius="0.01" material="src: #ppb-image-07; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_03" place-ppb-circle="id: PPB_VIDEO_03" radius="0.01" material="src: #ppb-image-06; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_04" place-ppb-circle="id: PPB_VIDEO_04" radius="0.01" material="src: #ppb-image-04; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_05" place-ppb-circle="id: PPB_VIDEO_05" radius="0.01" material="src: #ppb-image-03; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_06" place-ppb-circle="id: PPB_VIDEO_06" radius="0.01" material="src: #ppb-video-02; shader: flat; side: double"></a-circle>

    <!-- Iluminación general: hemisferio cálido (crema arriba / tierra cálida
         abajo), bajado a 0.20 para que deje de aplanar la sala -- el volumen
         real ahora lo aporta la directional y los dos focos de exposición.
         La directional sigue moderada (0.85, calida) para no repetir el
         quemado de las cápsulas moradas (Exhibit_Capsule_Purple, roughness
         bajo → brillo especular marcado) que ya se corrigió una vez: el
         color base/emisivo morado está bien en Blender y en el glTF
         exportado, el problema era solo de exposición combinada. -->
    <a-entity light="type: hemisphere; color: #f2d9cd; groundColor: #38233f; intensity: 0.20"></a-entity>
    <a-entity light="type: ambient; color: #824b96; intensity: 0.11"></a-entity>
    <a-entity light="type: directional; intensity: 0.62; color: #f0c4a9; castShadow: true; shadowBias: -0.0005; shadowMapWidth: 512; shadowMapHeight: 512" position="4 7 2" shadow="cast: true"></a-entity>

    <!-- Player rig: el rig va a nivel de suelo, la cámara dentro lleva la
         altura de ojos. museum-movement da WASD + flechas, suave, sin volar
         (ver script.js: aframe-extras/movement-controls y nav-mesh están
         rotos en esta versión de three.js, así que no se usan). clamp-to-
         bounds es nuestro "navmesh" (rectángulo real del suelo con huecos
         en cada peana). respawn-guard es la red de seguridad si algo
         fallara. -->
    <a-entity
      id="rig"
      position="0 0 0"
      rotation="0 0 0"
      museum-movement="speed: 1.0"
      clamp-to-bounds
      respawn-guard
    >
      <a-entity
        id="camera"
        camera="near: 0.05"
        drag-look-controls
        position="0 0.5 0"
      ></a-entity>
    </a-entity>
  </a-scene>


  <!-- Capa curatorial: un unico aviso, un unico panel y una unica ficha de
       ventana, reutilizados por todas las piezas desde museumContent -->
  <div id="intro-msg">
    <p>MOVE THROUGH THE SPACE AND APPROACH THE EXHIBITS TO DISCOVER MORE</p>
    <span class="hint-desktop"><b>WASD</b> — MOVE &nbsp;&nbsp; <b>DRAG</b> — LOOK</span>
    <span class="hint-mobile"><b>JOYSTICK</b> — MOVE &nbsp;&nbsp; <b>SWIPE</b> — LOOK</span>
  </div>

  <!-- Grafismo de sala: una sola pieza, muy tenue, como señaletica de museo -->
  <svg id="wall-graphic" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="46"/>
    <circle cx="100" cy="100" r="22"/><circle cx="82" cy="78" r="7"/>
    <circle cx="126" cy="118" r="10"/><circle cx="112" cy="70" r="4"/>
    <path d="M28 100h144M100 28v144"/>
  </svg>

  <aside id="exhibit-panel" role="dialog" aria-modal="false">
    <button class="panel-close" type="button" aria-label="Close">&times;</button>
    <div class="panel-head">
      <span class="panel-section">01</span>
      <div class="panel-images"></div>
      <h2 class="panel-title"></h2>
      <p class="panel-lead"></p>
    </div>
    <div class="panel-scroll-wrap">
      <div class="panel-scroll">
        <div class="panel-body"></div>
        <span class="panel-tags"></span>
      </div>
      <div class="panel-fade" aria-hidden="true"></div>
    </div>
  </aside>


  <script src="./script.js?v=1c4ff5e"></script>
</body>
</html>
