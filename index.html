<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Purple Bacteries</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div id="loading-screen">
    <div id="loading-title">Purple Bacteries</div>
    <div id="loading-spinner"></div>
  </div>

  <div id="controls-help">
    <span><b>WASD</b> Moverse</span>
    <span><b>Arrastrar</b> Mirar</span>
  </div>

  <a-scene
    renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 1.05"
    shadow="type: pcfsoft"
    background="color: #9aa7b3"
    fog="type: exponential; color: #7a8793; density: 0.06"
  >
    <a-assets timeout="15000">
      <a-asset-item id="museo" src="./museo_bacterias.glb"></a-asset-item>
    </a-assets>

    <!-- Modelo (museo_bacterias.glb, sustituye a museo_nascere_test.glb): reescalado
         en tiempo real a 10.7m de largo x 8m de alto (proporción real del modelo —
         es un espacio bastante más vertical que el de prueba, con nichos repartidos
         en varios niveles de pared), quita las luces horneadas de Blender (mal
         calibradas), corrige que el tone-mapping lave a blanco los materiales
         emisivos (para que el morado/turquesa diseñados en Blender se vean tal
         cual, sin recrear el color por código — ver fix-emissive-tonemap en
         script.js), coloca el rig del jugador dentro del espacio orientado a la
         exposición, y calcula los límites/huecos de navegación (ver script.js). -->
    <a-entity
      id="modelo"
      gltf-model="#museo"
      setup-museum-model="length: 10.7; height: 8; wallMargin: 0.4; eyeHeight: 0.5"
      neon-support-lights
      position="0 0 0"
      shadow="cast: true; receive: true"
    ></a-entity>

    <!-- Iluminación general: hemisferio cálido (crema arriba / tierra cálida
         abajo) + directional suave. Independiente del neón (que ya no se ve
         afectado por el tone-mapping gracias a neon-strips-fix), así que
         se puede subir sin lavar los morados/turquesas. -->
    <a-entity light="type: hemisphere; color: #fff6e8; groundColor: #b89f7d; intensity: 1.3"></a-entity>
    <a-entity light="type: directional; intensity: 0.7; color: #fff1dd" position="3 6 3" shadow="cast: true"></a-entity>

    <!-- Player rig: el rig va a nivel de suelo, la cámara dentro lleva la
         altura de ojos. museum-movement da WASD + flechas, suave, sin volar
         (ver script.js: aframe-extras/movement-controls y nav-mesh están
         rotos en esta versión de three.js, así que no se usan). clamp-to-
         bounds es nuestro "navmesh" (rectángulo real del suelo con huecos
         en cada peana). respawn-guard es la red de seguridad si algo
         fallara. -->
    <a-entity
      id="rig"
      position="0 0 0"
      rotation="0 0 0"
      museum-movement="speed: 1.0"
      clamp-to-bounds
      respawn-guard
    >
      <a-entity
        id="camera"
        camera="near: 0.05"
        drag-look-controls
        position="0 0.5 0"
      ></a-entity>
    </a-entity>
  </a-scene>

  <script src="./script.js"></script>
</body>
</html>
