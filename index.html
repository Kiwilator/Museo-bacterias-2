<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Purple Bacteries</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div id="loading-screen">
    <div id="loading-title">Purple Bacteries</div>
    <div id="loading-spinner"></div>
  </div>

  <div id="controls-help">
    <span><b>WASD</b> Moverse</span>
    <span><b>Arrastrar</b> Mirar</span>
  </div>

  <a-scene
    renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 1.05"
    shadow="type: pcfsoft"
    background="color: #9aa7b3"
    fog="type: exponential; color: #7a8793; density: 0.06"
  >
    <a-assets timeout="15000">
      <a-asset-item id="museo" src="./museo_bacterias.glb"></a-asset-item>
    </a-assets>

    <!-- Modelo (museo_bacterias.glb): esta es ahora la ÚNICA fuente de verdad
         del museo -- geometría, neones, materiales emisivos y texturas de
         suelo/pared vienen todos de Blender, exportados tal cual. A-Frame no
         crea ni recolorea neones ni geometría propia; solo reescala el modelo
         en tiempo real a 10.7m x 8m y quita las luces horneadas de Blender
         (mal calibradas para glTF). La exportación excluye, vía hide_render
         en el propio .blend (no listas de nombres en el script de export):
         las probetas de laboratorio (Lab_Batch2_*/Lab_Extra_*) y un puñado
         de mallas de neón que resultaron ser geometría suelta (no seguían
         ningún borde real) -- entre ellas la "tira de techo" que cruzaba la
         sala como una curva flotante. El resto de neones sí está pegado a
         bordes reales (ventana, nicho, peana, junta) y se exporta intacto.
         Suelo y pared llevan ahora textura horneada (antes eran nodos
         procedurales de Blender -- Noise/Bump/ColorRamp -- que glTF no
         puede leer y se exportaban como color plano). Coloca el rig del
         jugador dentro del espacio orientado a la exposición, y calcula los
         límites/huecos de navegación (ver script.js). -->
    <a-entity
      id="modelo"
      gltf-model="#museo"
      setup-museum-model="length: 10.7; height: 8; wallMargin: 0.4; eyeHeight: 0.5"
      position="0 0 0"
      shadow="cast: true; receive: true"
    ></a-entity>

    <!-- Iluminación general: hemisferio cálido (crema arriba / tierra cálida
         abajo) + directional suave. Bajada desde 1.3/0.7: a esa intensidad, la
         luz directional sobre las cápsulas moradas (Exhibit_Capsule_Purple,
         roughness bajo → brillo especular marcado) sumada al propio material
         superaba 1.0 en varios canales y el tone-mapping ACES lo comprimía
         hacia blanco — el color base/emisivo morado está bien en Blender y en
         el glTF exportado (verificado), el problema era solo de exposición.
         A esta intensidad la sala se sigue viendo iluminada pero el morado ya
         no se quema. -->
    <a-entity light="type: hemisphere; color: #fff6e8; groundColor: #b89f7d; intensity: 0.85"></a-entity>
    <a-entity light="type: directional; intensity: 0.45; color: #fff1dd" position="3 6 3" shadow="cast: true"></a-entity>

    <!-- Player rig: el rig va a nivel de suelo, la cámara dentro lleva la
         altura de ojos. museum-movement da WASD + flechas, suave, sin volar
         (ver script.js: aframe-extras/movement-controls y nav-mesh están
         rotos en esta versión de three.js, así que no se usan). clamp-to-
         bounds es nuestro "navmesh" (rectángulo real del suelo con huecos
         en cada peana). respawn-guard es la red de seguridad si algo
         fallara. -->
    <a-entity
      id="rig"
      position="0 0 0"
      rotation="0 0 0"
      museum-movement="speed: 1.0"
      clamp-to-bounds
      respawn-guard
    >
      <a-entity
        id="camera"
        camera="near: 0.05"
        drag-look-controls
        position="0 0.5 0"
      ></a-entity>
    </a-entity>
  </a-scene>

  <script src="./script.js"></script>
</body>
</html>
