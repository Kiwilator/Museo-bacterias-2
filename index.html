<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Museo Nascere 3D</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <a-scene
    renderer="colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic; exposure: 0.95; shadowMap: true;"
    background="color: #9aa7b3"
    fog="type: exponential; color: #7a8793; density: 0.06"
  >
    <a-assets timeout="15000">
      <a-asset-item id="museo" src="./museo_nascere_test.glb"></a-asset-item>
    </a-assets>

    <!-- Modelo: reescalado en tiempo real a 11m de largo x 3m de alto, quita las
         luces horneadas de Blender (mal calibradas), y al cargar coloca la
         cámara dentro del espacio (en su suelo real) y guarda los límites
         para no poder salir. fake-glow-test añade un halo de prueba a UNA
         peana morada y UNA turquesa (ver script.js, no replicar aún). -->
    <a-entity
      id="modelo"
      gltf-model="#museo"
      setup-museum-model="length: 11; height: 3; wallMargin: 0.4"
      fake-glow-test
      position="0 0 0"
      shadow="cast: true; receive: true"
    >
      <!-- Luces de apoyo de neón: posiciones reales tomadas de las luces
           originales de Blender (LUZ_Peana_Mesh_*, REBOTE_Nicho_Mesh_*),
           recalibradas a intensidad razonable, alcance corto, sin sombra.
           Pocas luces, no una por tira de LED. -->

      <!-- Peanas — izquierda morado/lila (suelo) -->
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.8; distance: 2.2; decay: 2" position="-0.920 0.050 -3.683"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.8; distance: 2.2; decay: 2" position="-2.130 0.050 3.013"></a-entity>

      <!-- Peanas — derecha turquesa/cian (suelo) -->
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.8; distance: 2.2; decay: 2" position="0.705 0.050 2.387"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.8; distance: 2.2; decay: 2" position="0.722 0.050 -3.598"></a-entity>

      <!-- Nichos/techo — derecha turquesa/cian (rebote suave) -->
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.5; distance: 2.5; decay: 2" position="0.468 2.641 -4.860"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.5; distance: 2.5; decay: 2" position="0.408 2.291 3.956"></a-entity>

      <!-- Nichos/techo — izquierda morado/lila (rebote suave) -->
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.5; distance: 2.5; decay: 2" position="-1.032 2.631 3.188"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.5; distance: 2.5; decay: 2" position="-1.317 2.438 -4.453"></a-entity>
    </a-entity>

    <!-- Iluminación general: hemisferio suave (crema arriba / tierra cálida
         abajo) en vez de ambient plano, + directional cálida y débil -->
    <a-entity light="type: hemisphere; color: #fff6e8; groundColor: #b89f7d; intensity: 1.0"></a-entity>
    <a-entity light="type: directional; intensity: 0.6; color: #fff1dd" position="3 6 3" shadow="cast: true"></a-entity>

    <!-- Cámara (WASD + look en la misma entidad, igual que bacterias-purpura) -->
    <!-- posición inicial la fija en runtime setup-museum-model al cargar el modelo -->
    <a-entity id="rig" position="0 1.6 0" rotation="0 0 0">
      <a-entity id="camera" camera look-controls wasd-controls="acceleration: 50; fly: false" cursor="rayOrigin: mouse" clamp-to-bounds></a-entity>
    </a-entity>
  </a-scene>

  <script src="./script.js"></script>
</body>
</html>
