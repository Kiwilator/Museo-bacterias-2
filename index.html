<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Purple Bacteries</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="./style.css?v=2f5f5ec">
</head>
<body>

  <div id="loading-screen">
    <div id="loading-title">Purple Bacteries</div>
    <div id="loading-spinner"></div>
  </div>

  <div id="controls-help">
    <span><b>WASD</b> Moverse</span>
    <span><b>Arrastrar</b> Mirar</span>
  </div>

  <a-scene
    renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 0.95"
    shadow="type: pcfsoft"
    background="color: #bda98f"
    fog="type: linear; color: #cbb89f; near: 4; far: 15.5"
  >
    <a-assets timeout="15000">
      <a-asset-item id="museo" src="./museo_bacterias.glb?v=2f5f5ec"></a-asset-item>
    </a-assets>

    <!-- Modelo (museo_bacterias.glb?v=2f5f5ec"tira de techo" que cruzaba la
         sala como una curva flotante. El resto de neones sí está pegado a
         bordes reales (ventana, nicho, peana, junta) y se exporta intacto.
         Suelo y pared llevan ahora textura horneada (antes eran nodos
         procedurales de Blender -- Noise/Bump/ColorRamp -- que glTF no
         puede leer y se exportaban como color plano). Coloca el rig del
         jugador dentro del espacio orientado a la exposición, y calcula los
         límites/huecos de navegación (ver script.js). -->
    <a-entity
      id="modelo"
      gltf-model="#museo"
      setup-museum-model="length: 10.7; height: 8; wallMargin: 0.4; playerRadius: 0.15; eyeHeight: 1.0"
      gltf-animations
      web-fixes
      exhibit-info
      exhibit-lighting
      feature-glass
      image-windows
      position="0 0 0"
      shadow="cast: true; receive: true"
    ></a-entity>

    <!-- Iluminación general: hemisferio cálido (crema arriba / tierra cálida
         abajo) + directional suave. Bajada desde 1.3/0.7: a esa intensidad, la
         luz directional sobre las cápsulas moradas (Exhibit_Capsule_Purple,
         roughness bajo → brillo especular marcado) sumada al propio material
         superaba 1.0 en varios canales y el tone-mapping ACES lo comprimía
         hacia blanco — el color base/emisivo morado está bien en Blender y en
         el glTF exportado (verificado), el problema era solo de exposición.
         A esta intensidad la sala se sigue viendo iluminada pero el morado ya
         no se quema. -->
    <a-entity light="type: hemisphere; color: #ffe6c4; groundColor: #8f6d47; intensity: 0.32"></a-entity>
    <a-entity light="type: directional; intensity: 0.95; color: #ffd7a3" position="4 7 2" shadow="cast: true"></a-entity>

    <!-- Player rig: el rig va a nivel de suelo, la cámara dentro lleva la
         altura de ojos. museum-movement da WASD + flechas, suave, sin volar
         (ver script.js: aframe-extras/movement-controls y nav-mesh están
         rotos en esta versión de three.js, así que no se usan). clamp-to-
         bounds es nuestro "navmesh" (rectángulo real del suelo con huecos
         en cada peana). respawn-guard es la red de seguridad si algo
         fallara. -->
    <a-entity
      id="rig"
      position="0 0 0"
      rotation="0 0 0"
      museum-movement="speed: 1.0"
      clamp-to-bounds
      respawn-guard
    >
      <a-entity
        id="camera"
        camera="near: 0.05"
        drag-look-controls
        position="0 0.5 0"
      ></a-entity>
    </a-entity>
  </a-scene>


  <!-- Capa curatorial: un unico aviso, un unico panel y una unica ficha de
       ventana, reutilizados por todas las piezas desde museumContent -->
  <div id="intro-msg">
    <p>MOVE THROUGH THE SPACE AND APPROACH THE EXHIBITS TO DISCOVER MORE</p>
    <span><b>WASD</b> — MOVE &nbsp;&nbsp; <b>DRAG</b> — LOOK</span>
  </div>

  <!-- Grafismo de sala: una sola pieza, muy tenue, como señaletica de museo -->
  <svg id="wall-graphic" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="46"/>
    <circle cx="100" cy="100" r="22"/><circle cx="82" cy="78" r="7"/>
    <circle cx="126" cy="118" r="10"/><circle cx="112" cy="70" r="4"/>
    <path d="M28 100h144M100 28v144"/>
  </svg>

  <button id="exhibit-prompt" type="button">EXPLORE +</button>

  <aside id="exhibit-panel" role="dialog" aria-modal="false">
    <button class="panel-close" type="button" aria-label="Close">&times;</button>
    <span class="panel-section">01</span>
    <span class="panel-icon"></span>
    <h2 class="panel-title"></h2>
    <p class="panel-lead"></p>
    <p class="panel-body"></p>
    <span class="panel-tags"></span>
  </aside>


  <script src="./script.js?v=2f5f5ec"></script>
</body>
</html>
