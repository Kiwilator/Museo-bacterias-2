<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Museo Nascere 3D</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <a-scene
    renderer="colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic; exposure: 0.85; shadowMap: true;"
    background="color: #9aa7b3"
    fog="type: exponential; color: #7a8793; density: 0.06"
  >
    <a-assets timeout="15000">
      <a-asset-item id="museo" src="./museo_nascere_test.glb"></a-asset-item>
    </a-assets>

    <!-- Modelo: reescalado en tiempo real a 11m de largo x 3m de alto, -->
    <!-- sea cual sea la unidad con la que se exportó desde Blender -->
    <a-entity
      id="modelo"
      gltf-model="#museo"
      scale-to-real-size="length: 11; height: 3"
      position="0 0 -6"
      shadow="cast: true; receive: true"
    ></a-entity>

    <a-entity light="type: ambient; intensity: 0.8; color: #fff"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="3 6 3" shadow="cast: true"></a-entity>

    <a-plane rotation="-90 0 0" width="40" height="40" color="#8b8f94" shadow="receive: true"></a-plane>

    <!-- Cámara (WASD + look en la misma entidad, igual que bacterias-purpura) -->
    <a-entity id="" position="0 1.6 10" rotation="0 0 0">
      <a-entity id="camera" camera look-controls wasd-controls="acceleration: 50; fly: false" cursor="rayOrigin: mouse"></a-entity>
    </a-entity>
  </a-scene>

  <script src="./script.js"></script>
</body>
</html>
