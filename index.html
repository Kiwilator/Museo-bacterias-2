<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Museo Nascere 3D</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <a-scene
    renderer="colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic; exposure: 1.05; shadowMap: true;"
    background="color: #9aa7b3"
    fog="type: exponential; color: #7a8793; density: 0.06"
  >
    <a-assets timeout="15000">
      <a-asset-item id="museo" src="./museo_nascere_test.glb"></a-asset-item>
    </a-assets>

    <!-- Modelo: reescalado en tiempo real a 11m de largo x 3m de alto, quita las
         luces horneadas de Blender (mal calibradas), y al cargar coloca la
         cámara dentro del espacio (en su suelo real) y guarda los límites
         para no poder salir. fake-glow-test añade un halo de prueba a UNA
         peana morada y UNA turquesa (ver script.js, no replicar aún). -->
    <a-entity
      id="modelo"
      gltf-model="#museo"
      setup-museum-model="length: 11; height: 3; wallMargin: 0.4"
      fake-glow-test
      position="0 0 0"
      shadow="cast: true; receive: true"
    >
      <!-- Luces de apoyo de neón: posiciones reales tomadas de las luces
           originales de Blender (LUZ_Peana_Mesh_*, REBOTE_Nicho_Mesh_*),
           recalibradas a intensidad razonable, alcance corto, sin sombra.
           Sin sombra + distance corta = barato en GPU aunque sean varias. -->

      <!-- Peanas — izquierda morado/lila, una por peana (8) -->
      <a-entity light="type: point; color: #8a3ff0; intensity: 1.0; distance: 2.2; decay: 2" position="-0.920 0.050 -3.683"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 1.0; distance: 2.2; decay: 2" position="-0.676 0.050 -0.337"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 1.0; distance: 2.2; decay: 2" position="-2.482 0.050 -3.626"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 1.0; distance: 2.2; decay: 2" position="-2.403 0.050 -2.853"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 1.0; distance: 2.2; decay: 2" position="-2.215 0.050 -2.113"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 1.0; distance: 2.2; decay: 2" position="-1.871 0.050 1.498"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 1.0; distance: 2.2; decay: 2" position="-2.057 0.050 2.253"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 1.0; distance: 2.2; decay: 2" position="-2.130 0.050 3.013"></a-entity>

      <!-- Peanas — derecha turquesa/cian, una por peana (2) -->
      <a-entity light="type: point; color: #1fd8cc; intensity: 1.0; distance: 2.2; decay: 2" position="0.705 0.050 2.387"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 1.0; distance: 2.2; decay: 2" position="0.722 0.050 -3.598"></a-entity>

      <!-- Nichos/techo — derecha turquesa/cian, 1 de cada 3 nichos (10 de 30) -->
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.841 2.843 2.100"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.401 2.959 1.738"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.389 2.742 -0.203"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.810 2.930 -3.101"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.811 2.651 0.112"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.513 2.538 -1.377"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.664 2.593 3.016"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.395 2.682 1.708"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="1.047 2.298 -0.937"></a-entity>
      <a-entity light="type: point; color: #1fd8cc; intensity: 0.6; distance: 2.5; decay: 2" position="0.904 2.399 -4.130"></a-entity>

      <!-- Nichos/techo — izquierda morado/lila, todos los detectados (6) -->
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.6; distance: 2.5; decay: 2" position="-1.032 2.631 3.188"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.6; distance: 2.5; decay: 2" position="-0.512 2.914 2.940"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.6; distance: 2.5; decay: 2" position="-0.230 2.955 2.300"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.6; distance: 2.5; decay: 2" position="-0.283 2.958 -3.752"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.6; distance: 2.5; decay: 2" position="-1.317 2.438 -4.453"></a-entity>
      <a-entity light="type: point; color: #8a3ff0; intensity: 0.6; distance: 2.5; decay: 2" position="-0.760 2.549 -4.732"></a-entity>
    </a-entity>

    <!-- Iluminación general: hemisferio suave (crema arriba / tierra cálida
         abajo) en vez de ambient plano, + directional cálida y débil -->
    <a-entity light="type: hemisphere; color: #fff6e8; groundColor: #b89f7d; intensity: 1.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.85; color: #fff1dd" position="3 6 3" shadow="cast: true"></a-entity>

    <!-- Cámara (WASD + look en la misma entidad, igual que bacterias-purpura) -->
    <!-- posición inicial la fija en runtime setup-museum-model al cargar el modelo -->
    <a-entity id="rig" position="0 1.6 0" rotation="0 0 0">
      <a-entity id="camera" camera look-controls wasd-controls="acceleration: 50; fly: false" cursor="rayOrigin: mouse" clamp-to-bounds></a-entity>
    </a-entity>
  </a-scene>

  <script src="./script.js"></script>
</body>
</html>
