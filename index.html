<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PURPLE BACTERIA</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <link rel="icon" href="data:,">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="./style.css?v=50b38af">
</head>
<body>

  <div id="language-switcher" role="group" aria-label="Language selection">
    <button type="button" data-language="en" aria-pressed="true">EN</button>
    <span aria-hidden="true">/</span>
    <button type="button" data-language="es" aria-pressed="false">ES</button>
  </div>

  <button id="credits-trigger" type="button">CREDITS</button>

  <div id="loading-screen">
    <div id="loading-title">PURPLE BACTERIA</div>
    <div id="loading-spinner"></div>
  </div>


  <div id="controls-help">
    <span class="hint-desktop"><b>WASD</b> <span class="control-action">Move</span></span>
    <span class="hint-desktop"><b>Drag</b> <span class="control-action">Look</span></span>
    <span class="hint-mobile"><b>Joystick</b> <span class="control-action">Move</span></span>
    <span class="hint-mobile"><b>Swipe</b> <span class="control-action">Look</span></span>
  </div>


  <div id="mobile-controls" aria-hidden="true">
    <div id="joystick-base"><div id="joystick-nub"></div></div>
  </div>

  <a-scene
    renderer="colorManagement: true; toneMapping: ACESFilmic; exposure: 0.80; antialias: true; maxCanvasWidth: 1920; maxCanvasHeight: 1080"
    shadow="type: pcfsoft"
    background="color: #261b2c"
    fog="type: linear; color: #8c748e; near: 9; far: 24"
  >
    <a-assets timeout="60000">
      <a-asset-item id="museum_floor" src="./modulos/museum_floor.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="museum_walls" src="./modulos/museum_walls.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="museum_neons" src="./modulos/museum_neons.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bacteria_large_01" src="./modulos/bacteria_large_01.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bacteria_large_02" src="./modulos/bacteria_large_02.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bacteria_small_01" src="./modulos/bacteria_small_01.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bacteria_small_02" src="./modulos/bacteria_small_02.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bacteria_small_03" src="./modulos/bacteria_small_03.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bacteria_small_04" src="./modulos/bacteria_small_04.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bacteria_small_05" src="./modulos/bacteria_small_05.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bacteria_small_06" src="./modulos/bacteria_small_06.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="bioreactor" src="./modulos/bioreactor.glb?v=50b38af"></a-asset-item>
      <a-asset-item id="iss_space_mission" src="./modulos/iss_space_mission.glb?v=50b38af"></a-asset-item>
      <video id="ppb-video-02" src="./assets/videos/scientific-animation.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
      <video id="ppb-video-03" src="./assets/videos/cereibacter-sphaeroides-animation.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
      <video id="ppb-video-04" src="./assets/videos/rhodobacter-capsulatus-animation.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
      <video id="ppb-video-05" src="./assets/videos/rhodomicrobium-vannielii-animation.mp4" autoplay loop muted playsinline crossorigin="anonymous"></video>
    </a-assets>


    <a-entity
      id="modelo"
      setup-museum-model="length: 10.7; height: 8; wallMargin: 0.4; playerRadius: 0.15; eyeHeight: 1.0"
      web-fixes
      exhibit-info
      electroactivity-exhibit
      exhibit-lighting
      image-windows
      application-visuals
      mood-lighting
      reactor-control
      co-hydrogen-exhibit
      pha-exhibit
      hydrogen-exhibit
      nitrogen-exhibit
      position="0 0 0"
      shadow="cast: true; receive: true"
    >
      <a-entity gltf-model="#museum_floor" gltf-animations></a-entity>
      <a-entity gltf-model="#museum_walls" gltf-animations></a-entity>
      <a-entity gltf-model="#museum_neons" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_large_01" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_large_02" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_01" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_02" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_03" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_04" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_05" gltf-animations></a-entity>
      <a-entity gltf-model="#bacteria_small_06" gltf-animations></a-entity>
      <a-entity gltf-model="#bioreactor" gltf-animations></a-entity>
    </a-entity>


    <a-entity
      id="space-mission"
      gltf-model="#iss_space_mission"
      space-mission-descent="anchor: Exhibit_Mesh0_Capsule; trigger: 2.35; release: 3.20; duration: 1.65"
      shadow="cast: true; receive: true"
      visible="false"
    ></a-entity>


    <a-circle id="PPB_VIDEO_01" place-ppb-circle="id: PPB_VIDEO_01" radius="0.01" material="color: #050415; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_02" place-ppb-circle="id: PPB_VIDEO_02" radius="0.01" material="color: #050415; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_03" place-ppb-circle="id: PPB_VIDEO_03" radius="0.01" material="src: #ppb-video-05; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_04" place-ppb-circle="id: PPB_VIDEO_04" radius="0.01" material="src: #ppb-video-04; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_05" place-ppb-circle="id: PPB_VIDEO_05" radius="0.01" material="src: #ppb-video-03; shader: flat; side: double"></a-circle>
    <a-circle id="PPB_VIDEO_06" place-ppb-circle="id: PPB_VIDEO_06" radius="0.01" material="src: #ppb-video-02; shader: flat; side: double"></a-circle>


    <a-entity light="type: hemisphere; color: #f2d9cd; groundColor: #38233f; intensity: 0.20"></a-entity>
    <a-entity light="type: ambient; color: #824b96; intensity: 0.11"></a-entity>
    <a-entity light="type: directional; intensity: 0.62; color: #f0c4a9; castShadow: true; shadowBias: -0.0005; shadowMapWidth: 512; shadowMapHeight: 512" position="4 7 2" shadow="cast: true"></a-entity>


    <a-entity
      id="rig"
      position="0 0 0"
      rotation="0 0 0"
      museum-movement="speed: 1.0"
      clamp-to-bounds
      respawn-guard
    >
      <a-entity
        id="camera"
        camera="near: 0.05"
        drag-look-controls
        position="0 0.5 0"
      ></a-entity>
    </a-entity>
  </a-scene>


  <div id="intro-msg">
    <p>MOVE THROUGH THE SPACE AND APPROACH THE EXHIBITS TO DISCOVER MORE</p>
    <span class="hint-desktop"><b>WASD</b> — <span class="intro-move">MOVE</span> &nbsp;&nbsp; <b class="intro-drag">DRAG</b> — <span class="intro-look">LOOK</span></span>
    <span class="hint-mobile"><b>JOYSTICK</b> — <span class="intro-move">MOVE</span> &nbsp;&nbsp; <b class="intro-swipe">SWIPE</b> — <span class="intro-look">LOOK</span></span>
  </div>


  <svg id="wall-graphic" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="46"/>
    <circle cx="100" cy="100" r="22"/><circle cx="82" cy="78" r="7"/>
    <circle cx="126" cy="118" r="10"/><circle cx="112" cy="70" r="4"/>
    <path d="M28 100h144M100 28v144"/>
  </svg>

  <aside id="exhibit-panel" role="dialog" aria-modal="false">
    <button class="panel-close" type="button" aria-label="Close">&times;</button>
    <div class="panel-head">
      <span class="panel-section">01</span>
      <div class="panel-images"></div>
      <h2 class="panel-title"></h2>
      <p class="panel-lead"></p>
    </div>
    <div class="panel-scroll-wrap">
      <div class="panel-scroll">
        <div class="panel-body"></div>
        <span class="panel-tags"></span>
      </div>
      <div class="panel-fade" aria-hidden="true"></div>
    </div>
  </aside>

  <aside id="credits-panel" role="dialog" aria-modal="false" aria-labelledby="credits-title">
    <button class="credits-close" type="button" aria-label="Close">&times;</button>
    <span class="credits-section">00</span>
    <h2 id="credits-title">CREDITS &amp; SOURCES</h2>
    <div class="credits-scroll">
      <section class="credits-block">
        <h3 id="credits-media-title">IMAGES &amp; VIDEOS</h3>
        <div id="credits-media"></div>
      </section>
      <section class="credits-block">
        <h3 id="credits-science-title">SCIENTIFIC SOURCES</h3>
        <div id="credits-science"></div>
      </section>
      <section class="credits-block">
        <h3 id="credits-development-title">MUSEUM DEVELOPMENT</h3>
        <div id="credits-development"></div>
      </section>
    </div>
  </aside>


  <script src="./museum-i18n.js?v=50b38af"></script>
  <script src="./script.js?v=50b38af"></script>
</body>
</html>
